<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Functions Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .response.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .response.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .loading {
            text-align: center;
            color: #666;
            margin-top: 20px;
            display: none;
        }

        .config-note {
            margin-top: 30px;
            padding: 15px;
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 5px;
            font-size: 13px;
            color: #856404;
        }

        .config-note strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Azure Functions Demo</h1>
        <p class="subtitle">Simple Python backend with web front end</p>
        
        <div class="input-group">
            <label for="nameInput">Enter your name:</label>
            <input type="text" id="nameInput" placeholder="John Doe">
        </div>

        <button id="submitBtn" onclick="callAzureFunction()">Send to Azure Function</button>

        <div class="loading" id="loading">Processing...</div>
        <div class="response" id="response"></div>

        <div class="config-note">
            <strong>Configuration:</strong>
            Update the <code>FUNCTION_URL</code> in the script below with your deployed Azure Function URL.
        </div>
    </div>

    <script>
        // IMPORTANT: Replace this with your actual Azure Function URL after deployment
        //const FUNCTION_URL = 'http://localhost:7071/api/hello'; // Local development URL
        const FUNCTION_URL = 'https://vijaygenericfunction-dse2esh7eah2bsd9.eastus-01.azurewebsites.net/api/hello'; // Local development URL
        
        // For production, use: 'https://your-function-app.azurewebsites.net/api/hello'

        async function callAzureFunction() {
            const nameInput = document.getElementById('nameInput');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const response = document.getElementById('response');
            
            const name = nameInput.value.trim();
            
            if (!name) {
                showResponse('Please enter a name!', 'error');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            loading.style.display = 'block';
            response.style.display = 'none';

            try {
                const res = await fetch(`${FUNCTION_URL}?name=${encodeURIComponent(name)}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await res.json();

                if (res.ok) {
                    showResponse(data.message, 'success');
                } else {
                    showResponse(data.message || 'An error occurred', 'error');
                }
            } catch (error) {
                showResponse(`Error connecting to Azure Function: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showResponse(message, type) {
            const response = document.getElementById('response');
            response.textContent = message;
            response.className = `response ${type}`;
            response.style.display = 'block';
        }

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                callAzureFunction();
            }
        });
    </script>
</body>
</html>
